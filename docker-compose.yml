version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ibooks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resource_marketplace
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d resource_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ibooks_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ibooks_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ibooks_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ibooks_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:${DB_PASSWORD:-changeme}@postgres:5432/resource_marketplace
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - MONITOR_PERFORMANCE=true
      - MONITOR_AUDIT=true
      - LOG_LEVEL=INFO
      - SITE_URL=http://localhost
    volumes:
      - ./logs/backend:/app/logs
      - ./static_pages:/app/static_pages
      - ./uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    networks:
      - ibooks_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibooks_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    ports:
      - "3000:3000"
    networks:
      - ibooks_network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ibooks_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ibooks_network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: ibooks_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - ibooks_network

  # Loki Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: ibooks_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - ibooks_network

  # Promtail Log Collector
  promtail:
    image: grafana/promtail:latest
    container_name: ibooks_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./logs:/var/log
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - ibooks_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  ibooks_network:
    driver: bridge
