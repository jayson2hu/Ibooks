name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: pip-audit -r requirements.txt
      - run: ruff check .
      - run: pytest -q
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/ibooks_ci.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-only-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npx tsc --noEmit --incremental false
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: docker compose config --quiet
        env:
          # Reserved .invalid URLs and non-production credentials are only
          # used to exercise Compose's required-variable interpolation.
          DB_PASSWORD: ci-only-database-password
          JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-characters
          GRAFANA_PASSWORD: ci-only-grafana-password
          SITE_URL: https://ibooks.example.invalid
          API_PUBLIC_URL: https://api.ibooks.example.invalid
          CORS_ORIGINS: https://ibooks.example.invalid
          ALIPAY_SANDBOX: 'true'
